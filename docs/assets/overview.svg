<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
<title id="title">Monochrome — color to grayscale in one click</title>
<desc id="desc">An original illustration, not a screenshot: two display cards show the same shapes in color and grayscale.</desc>
<rect width="1200" height="460" rx="24" fill="#101116"/>
<g font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif">
<circle cx="65" cy="62" r="18" fill="#f3f3f5"/>
<path d="M65 44a18 18 0 0 1 0 36z" fill="#101116"/>
<text x="102" y="72" fill="#f5f5f7" font-size="34" font-weight="650">Monochrome</text>
<text x="1150" y="68" fill="#9598a5" font-size="17" text-anchor="end">NATIVE MACOS · MENU BAR UTILITY</text>
<text x="48" y="132" fill="#b5b7c2" font-size="24">Less color. One click.</text>
<g transform="translate(48 166)">
<rect width="480" height="222" rx="16" fill="#1a1c25" stroke="#343744"/>
<path d="M0 36h480" stroke="#343744"/>
<text x="22" y="25" fill="#b5b7c2" font-size="15">COLOR</text>
<circle cx="446" cy="18" r="7" fill="none" stroke="#f5f5f7" stroke-width="2"/>
<rect x="22" y="58" width="192" height="142" rx="10" fill="#4d71e8"/>
<circle cx="118" cy="129" r="44" fill="#91abff"/>
<rect x="232" y="58" width="226" height="62" rx="10" fill="#d97c57"/>
<rect x="232" y="138" width="104" height="62" rx="10" fill="#719e81"/>
<rect x="354" y="138" width="104" height="62" rx="10" fill="#c3a965"/>
</g>
<path d="M563 277h68m-13-12 13 12-13 12" fill="none" stroke="#9195a5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<g transform="translate(672 166)">
<rect width="480" height="222" rx="16" fill="#1a1c25" stroke="#343744"/>
<path d="M0 36h480" stroke="#343744"/>
<text x="22" y="25" fill="#b5b7c2" font-size="15">GRAYSCALE</text>
<circle cx="446" cy="18" r="7" fill="#f5f5f7"/>
<path d="M446 11a7 7 0 0 1 0 14z" fill="#1a1c25"/>
<rect x="22" y="58" width="192" height="142" rx="10" fill="#787878"/>
<circle cx="118" cy="129" r="44" fill="#adadad"/>
<rect x="232" y="58" width="226" height="62" rx="10" fill="#929292"/>
<rect x="232" y="138" width="104" height="62" rx="10" fill="#929292"/>
<rect x="354" y="138" width="104" height="62" rx="10" fill="#aeaeae"/>
</g>
<text x="48" y="431" fill="#828695" font-size="16">Left click: toggle · Right click: menu</text>
<text x="1152" y="431" fill="#828695" font-size="14" text-anchor="end">Illustration — not a screenshot</text>
</g></svg>
